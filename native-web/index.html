<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>EnergyGuard JRB</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: -apple-system, system-ui, sans-serif;
        background: #0a3161;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      }
      main {
        width: min(28rem, 100%);
        background: #ffffff;
        color: #12263a;
        border-radius: 1.25rem;
        padding: 1.5rem;
      }
      h1 { margin: 0 0 0.35rem; font-size: 1.6rem; }
      p { margin: 0 0 1rem; line-height: 1.4; }
      label { display: block; font-weight: 700; margin-bottom: 0.4rem; }
      input {
        width: 100%;
        min-height: 56px;
        font-size: 1.125rem;
        border: 2px solid #d0d7e2;
        border-radius: 0.85rem;
        padding: 0.75rem;
        margin-bottom: 1rem;
      }
      button {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 0.85rem;
        background: #0a3161;
        color: #fff;
        font-size: 1.125rem;
        font-weight: 700;
      }
      button.secondary {
        background: #ffffff;
        color: #0a3161;
        border: 2px solid #0a3161;
        margin-top: 0.75rem;
      }
      .muted { color: #5b6b7c; font-size: 0.95rem; }
      details.support {
        margin-top: 1rem;
      }
      details.support summary {
        cursor: pointer;
        color: #5b6b7c;
        font-size: 0.9rem;
        font-weight: 600;
      }
      details.support .panel {
        margin-top: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="muted">Electric Delivery</p>
      <h1>EnergyGuard JRB</h1>
      <p id="status">Opening the job brief on this iPhone…</p>
      <button type="button" id="connect">Connect</button>
      <details class="support" id="support">
        <summary>Change server</summary>
        <div class="panel">
          <p class="muted">Support and testing only. Field crews can ignore this.</p>
          <label for="server">Server address</label>
          <input id="server" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://" />
          <button type="button" id="save">Save and connect</button>
          <button type="button" class="secondary" id="reset">Use default server</button>
        </div>
      </details>
    </main>
    <script>
      const OVERRIDE_KEY = "energyguard.serverUrlOverride";
      const LEGACY_KEY = "energyguard.serverUrl";
      const DEFAULT_SERVER_URL = "https://jbub28-production.up.railway.app";
      const input = document.getElementById("server");
      const connect = document.getElementById("connect");
      const save = document.getElementById("save");
      const reset = document.getElementById("reset");
      const support = document.getElementById("support");
      const status = document.getElementById("status");
      let autoConnectTimer = 0;

      function normalize(value) {
        const trimmed = String(value || "").trim();
        if (!trimmed) return "";
        try {
          const url = new URL(trimmed.includes("://") ? trimmed : `https://${trimmed}`);
          if (url.protocol !== "https:" && url.hostname !== "localhost" && url.hostname !== "127.0.0.1") {
            throw new Error("Use https");
          }
          return url.origin;
        } catch {
          return "";
        }
      }

      function go(url) {
        window.location.replace(url);
      }

      function cancelAutoConnect() {
        if (autoConnectTimer) {
          window.clearTimeout(autoConnectTimer);
          autoConnectTimer = 0;
        }
      }

      function readOverride() {
        return normalize(localStorage.getItem(OVERRIDE_KEY));
      }

      async function defaultUrl() {
        try {
          const data = await fetch("./server-default.json").then((r) => r.json());
          return normalize(data.url) || DEFAULT_SERVER_URL;
        } catch {
          return DEFAULT_SERVER_URL;
        }
      }

      support.addEventListener("toggle", () => {
        if (support.open) {
          cancelAutoConnect();
          status.textContent = "Enter a server address for testing or support, then save.";
        }
      });

      connect.addEventListener("click", async () => {
        cancelAutoConnect();
        const url = readOverride() || (await defaultUrl());
        go(url);
      });

      save.addEventListener("click", () => {
        const url = normalize(input.value);
        if (!url) {
          input.focus();
          return;
        }
        localStorage.setItem(OVERRIDE_KEY, url);
        go(url);
      });

      reset.addEventListener("click", async () => {
        localStorage.removeItem(OVERRIDE_KEY);
        localStorage.removeItem(LEGACY_KEY);
        const url = await defaultUrl();
        input.value = url;
        go(url);
      });

      (async () => {
        localStorage.removeItem(LEGACY_KEY);
        const fallback = await defaultUrl();
        const override = readOverride();
        input.value = override || fallback;
        if (support.open) return;
        autoConnectTimer = window.setTimeout(() => {
          go(override || fallback);
        }, 800);
      })();
    </script>
  </body>
</html>
